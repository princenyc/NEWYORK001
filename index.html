<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE SIGNAL: NYC OS [v7.5 SURVEILLANCE]</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --bg: #000; --accent: #ff3e3e; --311: #00f2ff; --jobs: #bc61ff; --cam: #00ff00; --panel: #0a0a0a; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; overflow: hidden; }
        #map { flex-grow: 1; background: #000; }
        .sidebar, .right-panel { width: 340px; background: var(--panel); border-right: 1px solid #1a1a1a; overflow-y: auto; padding: 20px; z-index: 10; }
        .right-panel { border-right: none; border-left: 1px solid #1a1a1a; }
        .status-bar { font-size: 0.5rem; color: #555; margin-bottom: 15px; border: 1px solid #222; padding: 5px; text-align: center; letter-spacing: 2px; }
        .status-bar span { color: #00ff00; font-weight: bold; }
        .section-header { font-size: 0.7rem; letter-spacing: 3px; margin: 20px 0 10px 0; text-transform: uppercase; border-bottom: 1px solid #222; padding-bottom: 5px; font-weight: 900; color: var(--accent); }
        .card { background: #080808; border: 1px solid #1a1a1a; padding: 10px; margin-bottom: 8px; border-left: 3px solid var(--311); font-size: 0.65rem; }
        .cam-box { border: 1px solid #222; background: #000; margin-bottom: 5px; }
        .cam-label { font-size: 0.45rem; color: #555; padding: 3px; text-transform: uppercase; overflow: hidden; white-space: nowrap; }
        .leaflet-tile { filter: invert(100%) hue-rotate(180deg) brightness(0.5) contrast(1.5) !important; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h1 style="font-size: 1rem; color: var(--accent); letter-spacing: 5px; margin: 0 0 5px 0;">NYC OS : SIGNAL</h1>
        <div class="status-bar">UPLINK: <span id="uplink">STABLE</span> // NODE: <span>ACER-BRAIN</span></div>
        
        <div class="section-header" style="color:var(--cam)">Live Surveillance</div>
        <div id="cam-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;"></div>

        <div class="section-header">Live 311 Intelligence</div>
        <div id="feed-311"></div>
    </div>

    <div id="map"></div>

    <div class="right-panel">
        <div class="section-header" style="color:var(--jobs)">Market Analysis</div>
        <div id="feed-jobs"></div>
        <div class="section-header">Atmospheric Loop</div>
        <img id="radar-img" src="" style="width:100%; border:1px solid #222; opacity:0.8; filter: grayscale(1);">
    </div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const map = L.map('map', { zoomControl: false, attributionControl: false }).setView([40.7128, -74.0060], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    const markerGroup = L.layerGroup().addTo(map);

    async function sync() {
        try {
            const res = await fetch('https://api.chartreuseexplosives.com/pulse');
            const data = await res.json();

            // Update UI
            document.getElementById('radar-img').src = data.radar + '?t=' + Date.now();
            document.getElementById('uplink').innerText = "STABLE";
            document.getElementById('uplink').style.color = "#00ff00";

            // Update Cameras
            const camGrid = document.getElementById('cam-grid');
            camGrid.innerHTML = '';
            data.cameras.forEach(cam => {
                const div = document.createElement('div');
                div.className = 'cam-box';
                div.innerHTML = `
                    <img src="${cam.image_url}" style="width:100%; filter: grayscale(1) contrast(1.2); display:block;">
                    <div class="cam-label">${cam.location}</div>`;
                camGrid.appendChild(div);
            });

            // Update 311 & Map
            markerGroup.clearLayers();
            document.getElementById('feed-311').innerHTML = '';
            data.vitals_311.forEach(item => {
                if(item.latitude) {
                    L.circleMarker([item.latitude, item.longitude], { radius: 4, color: '#00f2ff' }).addTo(markerGroup);
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `<b>${item.complaint_type}</b><br>${item.incident_address || 'N/A'}`;
                    document.getElementById('feed-311').appendChild(card);
                }
            });

            // Update Jobs
            document.getElementById('feed-jobs').innerHTML = '';
            data.jobs_market.forEach(job => {
                const card = document.createElement('div');
                card.className = 'card';
                card.style.borderLeftColor = '#bc61ff';
                card.innerHTML = `<b>${job.business_title}</b><br>${job.agency}`;
                document.getElementById('feed-jobs').appendChild(card);
            });

        } catch (e) {
            document.getElementById('uplink').innerText = "OFFLINE";
            document.getElementById('uplink').style.color = "red";
        }
    }

    sync();
    setInterval(sync, 60000);
</script>
</body>
</html>
